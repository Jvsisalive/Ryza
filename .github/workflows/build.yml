name: Build Ryza APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip ryza-app.zip
      - name: Build APK
        env:
          npm_config_legacy_peer_deps: "true"
        run: |
          cd ryza
          sed -i 's#"@capacitor-community/text-to-speech":"\^6.0.0"#"@capacitor-community/text-to-speech":"6.0.0"#' package.json
          bash setup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ryza-apk
          path: ryza/android/app/build/outputs/apk/debug/app-debug.apk
